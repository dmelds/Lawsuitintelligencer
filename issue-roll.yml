name: Issue roll

# Rolls the masthead issue line on the evergreen pages to the current issue on
# the 1st of each month. Articles keep the issue they ran in and are never
# read. mass-tort-map and state-ai-enforcement-tracker are held back: they
# roll with their monthly rewrite, not with the calendar. See
# scripts/roll_issue_line.py.
#
# Runs at 05:13 UTC so the masthead is already current when Content Checks
# reports at 09:00.
#
# The commit carries [skip lastmod]: the masthead is template, not an edit,
# so no page's sitemap <lastmod> moves for it. A push made with the workflow
# token starts no other workflow.

on:
  schedule:
    - cron: '13 5 1 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (print the roll, write nothing)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: issue-roll
  cancel-in-progress: false

jobs:
  roll:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Roll the evergreen issue lines
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python3 scripts/roll_issue_line.py --dry-run
          else
            python3 scripts/roll_issue_line.py
          fi

      - name: Check issue lines
        if: ${{ inputs.dry_run != true }}
        run: python3 scripts/check_issue_line.py --strict

      - name: Commit
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then
            echo "Masthead already current, nothing to commit."
            exit 0
          fi
          git commit -m "Issue roll: masthead to $(date -u +'%B %Y') [skip lastmod]"
          git push
