name: Build sitemap

# Regenerates sitemap.xml whenever pages change on main, and on demand.
# The commit it makes is sitemap-only and tagged [skip ci]; combined with the
# paths filter below, that prevents the workflow from retriggering itself.

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "scripts/generate_sitemap.py"
      - ".github/workflows/sitemap.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sitemap-${{ github.ref }}
  # Queue rather than cancel. Cancelling an in-flight run to start a newer one
  # is safe only if the newer run finishes; when it loses the push race, the
  # cancelled run is gone and sitemap.xml silently stays stale.
  cancel-in-progress: false

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history so per-file git commit dates (lastmod) are accurate.
          fetch-depth: 0

      - name: Generate sitemap.xml
        run: python3 scripts/generate_sitemap.py

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain sitemap.xml)" ]; then
            echo "sitemap.xml already up to date; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "chore: regenerate sitemap.xml [skip ci]"
          BRANCH="$(git branch --show-current)"
          # This workflow and Generate Redirects both fire on the same push and
          # both push to main. A single rebase-then-push loses whichever lands
          # second, so retry with backoff instead of failing the run.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin "$BRANCH" && git push; then
              echo "Pushed sitemap.xml on attempt $attempt"
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying"
            sleep $(( attempt * 3 + RANDOM % 4 ))
          done
          echo "::error::Could not push sitemap.xml after 5 attempts"
          exit 1
