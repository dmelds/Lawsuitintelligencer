name: Check Issue Line

# The masthead issue line means two different things depending on the page, and
# check_issue_line.py exists to keep the two from being confused for each other.
# On an article it is an archive stamp naming the issue the piece ran in, and it
# never moves. On an evergreen page it names the current issue and advances with
# the calendar.
#
# The PR run is a gate: it blocks a merge that rolls a published article to a
# month it did not run in, or that leaves the number and the month disagreeing.
#
# The monthly run is a review reminder, not a gate. It reports and exits 0, and
# the only thing it can flag is an evergreen page the calendar has moved past.
# It fires on the 1st, which is the morning the issue turns over.

on:
  pull_request:
    branches: [main]
    paths: ['**.html']
  schedule:
    - cron: '0 9 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-issue-line:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check issue lines (gate)
        if: ${{ github.event_name == 'pull_request' }}
        run: python3 check_issue_line.py --strict

      - name: Check issue lines (report)
        if: ${{ github.event_name != 'pull_request' }}
        run: python3 check_issue_line.py
